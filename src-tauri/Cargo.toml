[package]
name = "mofuchat-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mofuchat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenv-build = "0.1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-decorum = "1.1.1"
window-vibrancy = "0.8.1"
eyre = "0.6.14"
async-trait = "0.1"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = "0.13.5"
reqwest-websocket = "0.6.0"
futures-util = "0.3"
twitch_api = { version = "0.8.0", features = ["twitch_oauth2", "client", "helix", "hmac", "eventsub", "reqwest"] }
keyring = "4.2.0"
chrono = "0.4.45"
tauri-plugin-os = "2"
cached = { version = "4.1.1", features = ["async"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["objc2-app-kit", "WKWebView"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
